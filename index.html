<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6e3e94" />
    <title>Avatar World</title>
    <style>
      :root {
        color-scheme: dark;
        --purple: #6e3e94;
        --pink: #ec73b7;
        --yellow: #ffe783;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 15%, #bd7ac6 0, transparent 34rem),
          linear-gradient(145deg, var(--purple), var(--pink));
        font-family: Arial, Helvetica, sans-serif;
      }

      .game {
        width: min(100vw, 1280px);
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(12px, 3vw, 32px);
      }

      .screen {
        position: relative;
        width: min(100%, 1024px);
        aspect-ratio: 1024 / 600;
        overflow: hidden;
        border: 4px solid rgba(255, 247, 193, .95);
        border-radius: clamp(14px, 2.2vw, 28px);
        box-shadow: 0 18px 45px rgba(35, 10, 55, .42);
        background: #5e3678;
      }

      .welcome,
      .story-image,
      .click-zone {
        position: absolute;
        inset: 0;
      }

      .welcome {
        display: grid;
        place-items: center;
        padding: 20px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 37%, rgba(255, 229, 126, .5), transparent 18%),
          linear-gradient(145deg, #4e276a, #c34a9d);
        transition: opacity .35s ease, visibility .35s ease;
      }

      .welcome.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .welcome h1 {
        margin: 0 0 14px;
        color: #fff8ce;
        font-size: clamp(2rem, 6vw, 4.75rem);
        line-height: .95;
        text-shadow: 0 4px 0 #6d3479, 0 7px 16px rgba(0, 0, 0, .3);
      }

      .welcome p {
        margin: 0;
        font-size: clamp(.9rem, 2vw, 1.25rem);
      }

      .story-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transform: scale(1.025);
        transition: opacity .4s ease, transform .4s ease;
        user-select: none;
        -webkit-user-drag: none;
      }

      .story-image.visible {
        opacity: 1;
        transform: scale(1);
      }

      .click-zone {
        z-index: 2;
        border: 0;
        cursor: pointer;
        background: transparent;
      }

      .click-zone:focus-visible {
        outline: 5px solid var(--yellow);
        outline-offset: -9px;
      }

      .hint {
        position: absolute;
        z-index: 3;
        right: 18px;
        bottom: 14px;
        margin: 0;
        padding: 8px 12px;
        border-radius: 999px;
        color: #402152;
        background: rgba(255, 248, 205, .93);
        font-weight: 700;
        font-size: clamp(.72rem, 1.7vw, 1rem);
        box-shadow: 0 3px 10px rgba(0, 0, 0, .2);
        pointer-events: none;
        transition: opacity .2s ease;
      }

      .screen.finished .click-zone { cursor: default; }
      .screen.finished .hint { opacity: 0; }
    </style>
  </head>
  <body>
    <main class="game">
      <section class="screen" id="screen" aria-label="Avatar World story">
        <div class="welcome" id="welcome">
          <div>
            <h1>Avatar World</h1>
            <p>Click to start your adventure</p>
          </div>
        </div>

        <img class="story-image" src="assets/image-1.jpg" alt="Avatar World map" />
        <img class="story-image" src="assets/image-2.jpg" alt="Choose your character" />
        <img class="story-image" src="assets/image-3.jpg" alt="Avatar World start screen" />

        <button class="click-zone" id="next" type="button" aria-label="Start the story"></button>
        <p class="hint" id="hint">Click to start</p>
      </section>
    </main>

    <script>
      const screen = document.getElementById('screen');
      const welcome = document.getElementById('welcome');
      const nextButton = document.getElementById('next');
      const hint = document.getElementById('hint');
      const images = [...document.querySelectorAll('.story-image')];
      let step = -1;

      function advanceStory() {
        // After the third picture, the game remains on the final screen.
        if (step >= images.length - 1) return;

        step += 1;
        welcome.classList.add('hidden');
        images.forEach((image, index) => image.classList.toggle('visible', index === step));

        if (step === images.length - 1) {
          screen.classList.add('finished');
          nextButton.setAttribute('aria-label', 'Story finished');
          hint.textContent = 'Enjoy your world!';
        } else {
          hint.textContent = 'Click for the next screen';
          nextButton.setAttribute('aria-label', 'Show next screen');
        }
      }

      nextButton.addEventListener('click', advanceStory);
    </script>
  </body>
</html>
