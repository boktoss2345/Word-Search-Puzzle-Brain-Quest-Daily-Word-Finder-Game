<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14213d}#icon{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 76% 18%,#ffd166 0 14%,transparent 14.5%),radial-gradient(circle at 18% 85%,#ff7b54 0 18%,transparent 18.5%),linear-gradient(145deg,#143a5a,#16736c);font-family:Arial,sans-serif}.grid{position:absolute;inset:14%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);transform:rotate(-9deg);filter:drop-shadow(0 8px 7px #001b2b80)}.tile{display:grid;place-items:center;border:3px solid #fff9;background:#ffffffeb;color:#17314c;font-weight:900;font-size:clamp(12px,12vw,80px);border-radius:18%;margin:2px}.tile.hot{background:#ff7b54;color:#fff}.tile.gold{background:#ffd166;color:#694700}.spark{position:absolute;color:#fff;font-size:13vw;line-height:1}.s1{left:7%;top:8%}.s2{right:7%;bottom:5%;color:#b2f0dc}</style></head><body><div id="icon"><span class="spark s1">✦</span><span class="spark s2">✦</span><div class="grid"><i class="tile hot">W</i><i class="tile">O</i><i class="tile">R</i><i class="tile gold">D</i><i class="tile">S</i><i class="tile">E</i><i class="tile gold">A</i><i class="tile">R</i><i class="tile hot">C</i><i class="tile">H</i><i class="tile">P</i><i class="tile hot">U</i><i class="tile">Z</i><i class="tile gold">Z</i><i class="tile">L</i><i class="tile">E</i><i class="tile">G</i><i class="tile gold">A</i><i class="tile">M</i><i class="tile hot">E</i><i class="tile">B</i><i class="tile">R</i><i class="tile hot">A</i><i class="tile">I</i><i class="tile">N</i></div></div></body></html>
